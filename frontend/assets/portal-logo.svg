<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Portal de Solicitudes">
  <!-- Marca del portal: una solicitud con el visto de gestionada.
       Es la misma para las dos empresas a proposito. El portal lo comparten
       Maule Norte y Forest Saint, asi que el simbolo no puede pertenecer a
       ninguna: lo que distingue a cada una es el color y el selector del menu.
       Los tonos son pizarra, ni verdes ni morados, para no leerse como el
       color de una de las dos.
       Lleva fondo claro propio porque se usa tanto sobre la barra lateral
       oscura como sobre la tarjeta clara del login. -->
  <defs>
    <linearGradient id="portalFondo" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fb" />
      <stop offset="100%" stop-color="#e4eaef" />
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#portalFondo)" />
  <circle cx="64" cy="64" r="58" fill="none" stroke="#3f5666" stroke-width="4" />

  <!-- Hoja de solicitud -->
  <rect x="34" y="26" width="52" height="66" rx="7"
        fill="#ffffff" stroke="#3f5666" stroke-width="5" />

  <!-- Renglones -->
  <g stroke="#8ea3b3" stroke-width="5" stroke-linecap="round">
    <line x1="46" y1="44" x2="74" y2="44" />
    <line x1="46" y1="57" x2="74" y2="57" />
    <line x1="46" y1="70" x2="62" y2="70" />
  </g>

  <!-- Visto de gestionada -->
  <circle cx="88" cy="88" r="24" fill="#42708f" stroke="#f7f9fb" stroke-width="5" />
  <path d="M78 88l7 7 13-14" fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
